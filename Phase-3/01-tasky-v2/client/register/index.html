<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.9.0/axios.js"
        integrity="sha512-GT8LMUACuMRYRlIGLcE0kxMRD/b6Ac4Zoym+bhyoxa6uMJQhVQa61+ztIiqjHSUNdiQySGC8BMI3NoxHHfYy7w=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <title>Register</title>
</head>

<body>
    <div id="container" class="max-w-md mx-auto p-6 bg-white rounded-lg shadow-md mt-15">
        <h2 class="text-2xl font-bold mb-4">Register</h2>
        <form id="register-form">
            <div class="mb-4">
                <label for="fullname" class="block text-gray-700 font-medium mb-2">Full Name</label>
                <input type="text" id="fullname" name="fullname"
                    class="form-input block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500">
            </div>
            <div class="mb-4">
                <label for="phone" class="block text-gray-700 font-medium mb-2">Phone</label>
                <input type="text" id="phone" name="phone"
                    class="form-input block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500">
            </div>
            <div class="mb-4">
                <label for="email" class="block text-gray-700 font-medium mb-2">Email</label>
                <input type="email" id="email" name="email"
                    class="form-input block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500">
            </div>
            <div class="mb-4">
                <label for="password" class="block text-gray-700 font-medium mb-2">Password</label>
                <input type="password" id="password" name="password"
                    class="form-input block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500">
            </div>
            <button type="submit"
                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-45 rounded mt-4">Register</button>
            <p class="text-center text-gray-600 mt-4">
                Already have an account? <a href="../login" class="text-blue-500 hover:underline">Login here</a>
            </p>
        </form>
    </div>
</body>
<script src="script.js"></script>
</html>
