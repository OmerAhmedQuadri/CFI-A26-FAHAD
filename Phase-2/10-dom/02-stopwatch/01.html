<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="01.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Nobile:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Zen+Kaku+Gothic+New&display=swap"
        rel="stylesheet">
</head>

<body>
    <center>
        <h1 style="color: white;">Stopwatch</h1>
        <div id="stopwatch">
            <h2><span id="hours">--</span> : <span id="minutes">--</span> : <span id="seconds">--</span></h2>
        </div>
        <button id="start-stop-btn">Start</button>
        <button id="reset-btn">Reset</button>
    </center>
    <script src="01.js"></script>
</body>

</html>
