<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>counter</title>
    <style>
        #counter {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: 200px;
            margin: 0px;
            margin-top: 160px;
            margin-bottom: 50px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 20px;
            border: none;
            color: white;
        }

        #plus {
            background-color: rgb(91, 167, 91);
        }

        #minus {
            background-color: rgb(160, 90, 90);
        }
    </style>
</head>

<body>
    <center>
        <h2 id="counter">00</h2>
        <button id="plus">+</button>
        <button id="minus">-</button>
    </center>
    <script src="script.js"></script>
</body>

</html>
